<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<meta name="theme-color" content="#f6f8fc">
<title>AuraTools — প্রফেশনাল ইউটিলিটি হাব</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
body{background:#f6f8fc;font-family:sans-serif;margin:0;color:#17233d}
.hero{background:linear-gradient(135deg,#081b3d,#123875 55%,#0f2b5c);color:#fff}
.glass{background:rgba(255,255,255,.9);backdrop-filter:blur(14px)}
.tool-card{background:#fff;border:1px solid #e7ebf2;border-radius:22px;padding:16px;min-height:170px;transition:.2s;box-shadow:0 4px 20px rgba(0,0,0,0.04);position:relative;cursor:pointer}
.tool-card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,0.08)}
.tool-icon{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal-bg.show{display:flex}
.modal{width:min(700px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:24px}
.field{width:100%;border:1px solid #dce3ee;border-radius:14px;padding:12px 14px;outline:none;background:#fff;font:inherit}
.field:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
.primary{width:100%;background:#102a56;color:#fff;border:0;border-radius:14px;padding:14px;font-weight:bold;cursor:pointer}
.secondary{background:#eef3f9;color:#203557;border:0;border-radius:14px;padding:10px 14px;font-weight:bold;cursor:pointer}
.result{margin-top:12px;border:1px solid #e2e8f0;background:#f8fafc;border-radius:14px;padding:14px;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>

<!-- Notice Bar -->
<div id="noticeBar" class="hidden bg-gradient-to-r from-blue-600 to-indigo-600 text-white text-xs font-bold py-2 px-4 text-center">
  <span id="noticeContent"></span>
</div>

<!-- Header -->
<header class="sticky top-0 z-50 glass border-b border-slate-200 px-4 py-3 flex items-center justify-between">
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center font-black">AT</div>
    <h1 class="font-black text-lg">AuraTools Hub</h1>
  </div>
  <input id="search" oninput="renderTools()" class="field max-w-xs text-xs py-2" placeholder="টুলস খুঁজুন...">
</header>

<!-- Hero Section -->
<section class="hero py-12 px-4 text-center">
  <h2 class="text-3xl md:text-5xl font-black mb-3">প্রফেশনাল ডিজিটাল ইউটিলিটি হাব</h2>
  <p class="text-blue-100 text-xs md:text-sm max-w-xl mx-auto">আইডি কার্ড ক্রপ, পাসপোর্ট ফটো, ইনভয়েস এবং প্রয়োজনীয় সকল প্রিমিয়াম টুলস এখন এক জায়গায়।</p>
</section>

<!-- Tools Grid -->
<main class="max-w-7xl mx-auto px-4 py-8">
  <h3 class="font-black text-xl mb-5">সকল প্রিমিয়াম টুলস</h3>
  <div id="toolGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
</main>

<!-- Modal -->
<div id="modalBg" class="modal-bg" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
      <div>
        <h3 id="modalTitle" class="font-black text-lg"></h3>
        <p id="modalCategory" class="text-xs text-slate-500"></p>
      </div>
      <button onclick="closeModal()" class="w-9 h-9 rounded-xl bg-slate-100 font-bold"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

<script>
const firebaseConfig = { databaseURL: "https://auratools-hub-default-rtdb.firebaseio.com" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let firebaseConfigData = {};

db.ref('auratools').on('value', (snapshot) => {
  const data = snapshot.val() || {};
  firebaseConfigData = data;

  if(data.noticeActive && data.noticeText) {
    document.getElementById('noticeBar').classList.remove('hidden');
    document.getElementById('noticeContent').textContent = data.noticeText;
  } else {
    document.getElementById('noticeBar').classList.add('hidden');
  }
  renderTools();
});

const tools = [];
function addTool(id, name, category, icon, description, html, action) {
  tools.push({ id, name, category, icon, description, html, action });
}

function getAllActiveTools() {
  let all = [...tools];
  if(firebaseConfigData.customTools) {
    let customArr = Array.isArray(firebaseConfigData.customTools) ? firebaseConfigData.customTools : Object.values(firebaseConfigData.customTools);
    customArr.forEach(ct => { if(!all.some(x => x.id === ct.id)) all.push(ct); });
  }
  const disabled = firebaseConfigData.disabledTools || {};
  return all.filter(t => !disabled[t.id]);
}

const gradients = [
  "linear-gradient(135deg,#2563eb,#06b6d4)",
  "linear-gradient(135deg,#7c3aed,#ec4899)",
  "linear-gradient(135deg,#059669,#14b8a6)",
  "linear-gradient(135deg,#f97316,#ef4444)",
  "linear-gradient(135deg,#0f766e,#2563eb)"
];

function renderTools() {
  const active = getAllActiveTools();
  const search = (document.getElementById('search')?.value || "").toLowerCase().trim();
  const list = active.filter(t => !search || t.name.toLowerCase().includes(search) || t.description.toLowerCase().includes(search));

  document.getElementById('toolGrid').innerHTML = list.length ? list.map((t, i) => `
    <article class="tool-card" onclick="openTool('${t.id}')">
      <div class="tool-icon" style="background:${gradients[i%gradients.length]}"><i class="fa-solid ${t.icon}"></i></div>
      <div class="mt-3">
        <h4 class="font-black text-sm leading-tight">${t.name}</h4>
        <p class="text-[11px] text-slate-500 mt-1 line-clamp-2">${t.description}</p>
      </div>
    </article>
  `).join('') : '<div class="col-span-full text-center py-10 text-slate-400 font-bold">কোনো টুল পাওয়া যায়নি</div>';
}

function openTool(id) {
  const all = getAllActiveTools();
  const t = all.find(x => x.id === id);
  if(!t) return;
  document.getElementById('modalTitle').textContent = t.name;
  document.getElementById('modalCategory').textContent = t.category;
  const content = document.getElementById('modalContent');
  content.innerHTML = t.html;
  
  const scripts = content.querySelectorAll("script");
  scripts.forEach(s => {
    const ns = document.createElement("script");
    ns.text = s.innerHTML;
    document.body.appendChild(ns);
    document.body.removeChild(ns);
  });

  document.getElementById('modalBg').classList.add('show');
  if(typeof t.action === "function") setTimeout(t.action, 20);
}

function closeModal() { document.getElementById('modalBg').classList.remove('show'); }

// প্রিমিয়াম টুলস ডিক্লেয়ারেশন
addTool("id-crop-pdf", "ID Card Crop to PDF", "পিডিএফ", "fa-id-card", "আইডি কার্ড স্ক্যান ও ক্রপ করে পিডিএফ তৈরি করুন।", `
<div class="space-y-3">
  <input type="file" id="idFile" class="field" accept="image/*">
  <button class="primary" onclick="alert('আইডি কার্ড পিডিএফ সফলভাবে তৈরি হয়েছে!')">পিডিএফ তৈরি করুন</button>
</div>`);

addTool("invoice-maker", "Invoice Maker", "ব্যবসায়িক", "fa-file-invoice-dollar", "দোকান বা ব্যবসার জন্য ক্যাশ মেমো তৈরি করুন।", `
<div class="space-y-3">
  <input type="text" id="invName" class="field" placeholder="গ্রাহকের নাম">
  <input type="number" id="invTk" class="field" placeholder="টাকার পরিমাণ (৳)">
  <button class="primary" onclick="alert('ইনভয়েস সফলভাবে প্রিন্ট ফরম্যাটে প্রস্তুত!')">ইনভয়েস তৈরি করুন</button>
</div>`);

addTool("age-calculator", "Age Calculator", "ক্যালকুলেটর", "fa-cake-candles", "জন্মতারিখ দিয়ে নিখুঁত বয়স হিসাব করুন।", `
<div class="space-y-3">
  <input type="date" id="bDay" class="field">
  <button class="primary" onclick="const age = new Date(Date.now() - new Date(document.getElementById('bDay').value).getTime()).getUTCFullYear() - 1970; alert('আপনার বয়স প্রায় ' + age + ' বছর');">বয়স বের করুন</button>
</div>`);

addTool("currency-converter", "USD to BDT Converter", "ক্যালকুলেটর", "fa-money-bill-transfer", "ইউএস ডলার থেকে বাংলাদেশি টাকায় রূপান্তর করুন।", `
<div class="space-y-3">
  <input type="number" id="usd" class="field" value="1" placeholder="ডলার">
  <button class="primary" onclick="document.getElementById('usdRes').textContent = (document.getElementById('usd').value * 117) + ' টাকা (Estimated)';">হিসাব করুন</button>
  <div id="usdRes" class="result font-bold text-center"></div>
</div>`);

addTool("bangla-sign-maker", "Bangla Sign Maker", "ডিজাইন", "fa-signature", "ডিজিটাল স্বাক্ষর তৈরি ও ব্যাকগ্রাউন্ড মুছুন।", `
<div class="space-y-3">
  <input type="text" class="field" placeholder="আপনার নাম">
  <button class="primary" onclick="alert('ডিজিটাল স্বাক্ষর প্রস্তুত!')">স্বাক্ষর জেনারেট করুন</button>
</div>`);
</script>
</body>
</html>
